name: Deploy Angular App to Neubox (FTP)

on:
  push:
    branches:
      - main  # o master si tu rama principal se llama así

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Descargar tu repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Instalar Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Instalar dependencias
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Build de Angular (modo producción)
      - name: Build Angular app
        run: npm run build -- --configuration production

      # 5️⃣ Mover el contenido de dist/sebastianrdz/browser/ a dist/sebastianrdz/
      - name: Move browser build to dist root
        run: |
          if [ -d "dist/sebastianrdz/browser" ]; then
            cp -r dist/sebastianrdz/browser/* dist/sebastianrdz/
          fi

      # 6️⃣ Subir al hosting (tu dominio principal)
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/sebastianrdz/
          server-dir: /domains/sebastianrdz.com/public_html/