name: Deploy Angular App to Neubox (FTP)

on:
  push:
    branches:
      - main  # o master si tu rama principal se llama así

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Descargar tu repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Instalar Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Instalar dependencias
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Build de Angular (modo producción)
      - name: Build Angular app
        run: npm run build -- --configuration production

      # 5️⃣ Preparar archivos para deployment
      - name: Prepare deployment files
        run: |
          # Crear directorio temporal
          mkdir -p deploy-temp
          
          # Copiar solo el contenido de browser al directorio temporal
          if [ -d "dist/sebastianrdz/browser" ]; then
            cp -r dist/sebastianrdz/browser/* deploy-temp/
          else
            # Si no existe browser/, copiar todo dist/sebastianrdz/
            cp -r dist/sebastianrdz/* deploy-temp/
          fi
          
          # Verificar contenido
          ls -la deploy-temp/

      # 6️⃣ Subir al hosting (tu dominio principal)
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/sebastianrdz/
          server-dir: /domains/sebastianrdz.com/public_html/